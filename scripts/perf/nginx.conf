# Mirrors the ALB listener rules in infra/lib/constructs/compute-construct.ts.
upstream engine { server host.docker.internal:4400; keepalive 64; }
upstream web { server perf-web:3000; keepalive 16; }
server {
  listen 80;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_read_timeout 300s;
  location ^~ /api/auth/ { proxy_pass http://web; }
  location ~ ^/(api|v1|memories|channels/http|webhooks)/ { proxy_pass http://engine; }
  location = /health { proxy_pass http://engine; }
  location / { proxy_pass http://web; }
}
