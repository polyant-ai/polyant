version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # develop is the integration branch; main only ever receives releases, so
    # without this dependabot would open PRs against a branch that trails
    # develop and its version ranges would be stale on arrival.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # TypeScript 7 ships no programmatic compiler API (`require("typescript")`
      # exposes 2 keys instead of 2248), and two things in this tree need one:
      # eslint-config-next depends on typescript-eslint, whose peer range is
      # `<6.1.0` and which closed TS7 support as not planned; and next itself
      # resolves `typescript/lib/typescript.js`, a file TS 7 does not ship.
      # So TypeScript 6 stays in the tree regardless, and the bump can only
      # break `npm run lint` and `next build`. See the closing comment on #196.
      # Remove this once typescript-eslint declares TS7 support and next stops
      # requiring the TS6 API — both downstream of TypeScript 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
          - "ai"
      nestjs:
        patterns:
          - "@nestjs/*"
      next-react:
        patterns:
          - "next"
          - "next-*"
          - "react"
          - "react-*"
          - "@types/react*"
      radix-ui:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
  # docker entries removed: no Dockerfile exists in packages/engine or packages/web.
  # Re-add when Dockerfiles are introduced.
