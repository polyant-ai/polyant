name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels: [feature, enhancement]
  - title: "Bug Fixes"
    labels: [bug, fix]
  - title: "Security"
    labels: [security]
  - title: "Performance"
    labels: [performance]
  - title: "Documentation"
    labels: [documentation, docs]
  - title: "Dependencies"
    labels: [dependencies]
  - title: "Chores"
    labels: [chore, ci]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: [major, "breaking-change"]
  minor:
    labels: [minor, feature, enhancement]
  patch:
    labels: [patch, bug, fix, security, chore, dependencies]
  default: patch

template: |
  ## Changes

  $CHANGES

  > Comparison draft only. The reviewed file in `docs/releases/` is the release source of truth.

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
