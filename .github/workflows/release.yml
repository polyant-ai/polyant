name: Release comparison draft

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-comparison-draft:
    name: Release comparison draft
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit v7 resolved to: a mutable tag on a third-party
      # action is a supply-chain hole — whoever can move the tag can run code
      # in a job holding contents:write. Bump the SHA and the comment together.
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
