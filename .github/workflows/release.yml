name: Release comparison draft

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-comparison-draft:
    name: Release comparison draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the commit v7 resolved to: a mutable tag on a third-party
      # action is a supply-chain hole — whoever can move the tag can run code
      # in a job holding contents:write. Bump the SHA and the comment together.
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
