name: E2E

# The Playwright suite in packages/web/e2e: a real browser against the engine
# and a production build of the web, on a migrated and seeded database. It takes
# minutes and a browser download, so it runs nightly and on demand instead of on
# every pull request. GitHub runs scheduled and manually dispatched workflows
# from the default branch only.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pgvector image: migration 0000 runs `CREATE EXTENSION vector`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: polyant
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polyant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # e2e/setup/test-env.ts reads the server coordinates from here, creates the
      # polyant_e2e database next to the default one, and gives the engine and
      # the web their own secrets and ports.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: polyant
      POSTGRES_PASSWORD: test
      # The migration step of e2e/setup/prepare-db.ts runs the engine's migrate.ts,
      # which validates the engine config before it touches the database. Locally
      # these come from .env; here they are the suite's own test-only values.
      AUTH_SECRET: polyant-e2e-auth-secret-at-least-32-characters-long
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Creates, migrates and seeds polyant_e2e, then lets Playwright boot the
      # engine (:4100) and build and start the web (:3100) before the specs run.
      - name: Run the end-to-end suite
        run: npm run test:e2e -w @polyant/web
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 14
