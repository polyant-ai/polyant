name: CI

# The jobs in this file are generic and may be renamed, split or merged. The
# `CI` job at the end is the only stable name: it needs every other job here and
# passes only when each of them succeeded or was skipped on purpose, so it is
# the one check branch protection requires. Checks defined in other workflow
# files report on their own and do not need changes here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Pushes to develop
# and main queue instead of cancelling, so every merged commit is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that change only documentation skip the build and test jobs,
  # and the Docker builds run only when one of their inputs changes. The skip
  # happens per job, behind the gate, instead of with a workflow-level
  # paths-ignore: an ignored workflow never reports, and a required check that
  # never reports keeps the pull request waiting forever. Pushes run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - id: classify
        name: Classify the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            node scripts/ci/classify-changes.mjs --all >> "$GITHUB_OUTPUT"
          else
            # previous_filename too: moving a file out of packages/ changes code.
            gh api --paginate "$PR_FILES" --jq '.[] | .filename, (.previous_filename // empty)' \
              | node scripts/ci/classify-changes.mjs >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Lint and web typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: npm run lint
      # Only the web is type-checked here. The engine's `tsc --noEmit` would
      # repeat the `tsc` that Build runs with the same tsconfig, tests included.
      # `next build` is no substitute for the web: its type check drops every
      # error reported in a *.test.* or __tests__ file.
      - run: npm run typecheck -w @polyant/web

  test:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # --coverage activates the thresholds in vitest.config.ts: a ratchet that
      # fails the build if a PR lowers coverage. Local runs stay fast without it.
      - run: npm run test:unit -w @polyant/engine -- --coverage

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret scanner diffs against the base ref, so it needs its history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `.claude/hooks/pre-commit-check.js` has scanned for these since the repo
      # began, but it is a CLAUDE CODE hook, not a git hook: it fires only when
      # Claude runs the commit through its Bash tool. There is no .husky/, no
      # postinstall and no core.hooksPath, so a human typing `git commit` — or
      # anyone contributing from a fork — was never checked, while CLAUDE.md
      # described the directory as "automatic enforcement". A local hook would
      # not fix that: it is skippable with --no-verify and has to be installed by
      # every clone. This job is neither, and it reads the same pattern list.
      - name: Scan added lines for secrets
        run: node scripts/ci/scan-secrets.cjs "origin/${{ github.base_ref || 'develop' }}"
      # These read README.md, CHANGELOG.md and docs/releases, and need no
      # installed dependencies, so they run on every change, docs included.
      - name: Check release metadata
        run: npm run release:verify
      # Every build- and release-tooling test, so a new script cannot land untested.
      - name: Test build and release tooling
        run: node --test scripts/*.test.mjs scripts/ci/*.test.mjs scripts/release/*.test.mjs
      - name: Check that the CI gate needs every job
        run: node scripts/ci/check-ci-gate.mjs .github/workflows/ci.yml
      # A workflow GitHub cannot parse never reports, so the required check
      # stays pending; this names the error instead, and catches the mistakes
      # that still parse (unknown keys, bad expressions, shell bugs).
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  test-web:
    name: Web Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      # 64 files / 655 tests that had never run in CI: `git log -S "polyant/web"`
      # on this file returned nothing since it was created. lint and build DO
      # cover the package, which is what made the gap easy to miss — web was in
      # CI, just never its tests. Everything the panel wrote to protect itself
      # (TenantScopeGuard, validateTenantParams, the locale key-parity contract)
      # was advisory until now.
      - run: npm run test -w @polyant/web -- --coverage

  integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        # pgvector image: migration 0000 runs `CREATE EXTENSION vector`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: polyant
          POSTGRES_PASSWORD: test
          POSTGRES_DB: polyant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # migrate.ts runs outside vitest, so it does not load test-setup.ts —
      # supply the config.ts-required vars (and DB coordinates) at the job level.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: polyant
      POSTGRES_PASSWORD: test
      POSTGRES_DB: polyant
      AUTH_SECRET: test-secret-at-least-32-chars-long-yes
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Integration files self-skip when the DB probe loses its 3s race, so a
      # database that is slow to accept turns the whole tier — every cross-org
      # isolation test included — into "9 passed" and a green tick. This flag
      # makes an unreachable database a FAILURE here while leaving the local
      # skip-when-absent behaviour alone.
      CI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install
      - run: npm run db:migrate -w @polyant/engine
      # On the freshly migrated database, before any test writes to it: a column
      # added to a schema file without its migration fails here, not in production.
      - run: npm run ci:schema-drift
      - run: npm run test:integration -w @polyant/engine

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The one job that saves the node_modules cache (on develop and main).
      - uses: ./.github/actions/install
        with:
          save-cache: "true"
      # Also the engine's type check: its build is `tsc` on the same tsconfig
      # as its typecheck script, test files included.
      - run: npm run build
      # The compiled migrator reads its SQL from dist; a build that does not ship
      # it boots into "Can't find meta/_journal.json".
      - run: diff -r packages/engine/src/database/migrations packages/engine/dist/database/migrations

  docker:
    name: Docker build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    # Room for a cold build that also exports every layer to the cache.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [engine, web]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the commit the tag resolved to, like the other third-party
      # actions: bump the SHA and the comment together.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only, no push: catches a Dockerfile that no longer builds from a
      # clean checkout (missing dirs, stray context files) before a release does.
      # Layers come from the Actions cache. Pushes to develop and main write it,
      # every stage included (mode=max) so the dependency installs are reused;
      # pull requests only read it, like the node_modules cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=docker-${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=docker-{0}', matrix.image) || '' }}

  # The single required check. It needs every job above (Repository checks
  # verifies that with scripts/ci/check-ci-gate.mjs) and runs even when one of them fails
  # or is cancelled: a gate skipped for a failed dependency would count as
  # passing. A job may only be `skipped` when its own path filter said so; a job
  # skipped because `changes` failed shows up through the failure of `changes`.
  ci:
    name: CI
    needs: [changes, repository, static, test, test-web, integration, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Not successful: $failed"
            exit 1
          fi
